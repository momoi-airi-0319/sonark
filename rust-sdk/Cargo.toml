[package]
name = "uniffi_sonark_sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "uniffi_sonark_sdk"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[[bin]]
name = "sonark-cli"
path = "src/bin/sonark-cli.rs"

[dependencies]
uniffi = { version = "0.28", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
android_logger = { version = "0.13", optional = true }
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
urlencoding = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
lofty = "0.21"
md5 = "0.7"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
android = ["dep:android_logger"]

[dev-dependencies]
mockito = "1.4"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
